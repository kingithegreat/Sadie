<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    HomeBot application mark.

    A distillation of the chat avatar the app already ships — a house whose
    outline is also a speech bubble — reduced until it survives a 16px taskbar
    slot. The avatar's circuit antennae and smile are dropped because at that
    size they fill in; what carries the identity is the gable, the tail, and the
    pill-shaped face with two eyes knocked out of it.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5FB0FF"/>
      <stop offset="55%" stop-color="#1E83F7"/>
      <stop offset="100%" stop-color="#0A56D6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)"/>

  <g transform="translate(79.6 64.8) scale(14.7)" fill="none" stroke="#fff"
     stroke-width="1.85" stroke-linejoin="round" stroke-linecap="round">
    <!-- House + speech tail, one closed outline -->
    <path d="M12 2.8 20.4 9.6V17.5A2.4 2.4 0 0 1 18 19.9H13.4L10.4 23.2 10.8 19.9H6A2.4 2.4 0 0 1 3.6 17.5V9.6Z"/>
    <!-- Face: a filled pill with the eyes knocked out, so it reads on any ground -->
    <path fill="#fff" stroke="none" fill-rule="evenodd" d="M10.35 11.5H13.65A3.05 3.05 0 0 1 13.65 17.6H10.35A3.05 3.05 0 0 1 10.35 11.5ZM11.65 14.55A1.05 1.05 0 1 1 9.55 14.55A1.05 1.05 0 1 1 11.65 14.55ZM14.45 14.55A1.05 1.05 0 1 1 12.35 14.55A1.05 1.05 0 1 1 14.45 14.55Z"/>
  </g>
</svg>
