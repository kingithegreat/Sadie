version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: homebot-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-sadie-fixed-dev-key-do-not-change}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - GENERIC_TIMEZONE=Pacific/Auckland
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console
      - N8N_WORKFLOW_HISTORY_ENABLED=true
      # Shared secret used by HomeBot to authenticate webhook requests.
      # start-homebot.ps1 sets this from the auto-generated webhook-secret file.
      - HOMEBOT_WEBHOOK_SECRET=${HOMEBOT_WEBHOOK_SECRET:-}
      
    volumes:
      # Persistent data
      - n8n_data:/home/node/.n8n
      
      # Memory volume for Docker
      - ./memory:/data/memory
      
      # Config volume for safety rules
      - ./config:/data/config:ro
      
      # Workflow imports (optional)
      - ./n8n-workflows:/workflows:ro
      
      # Custom scripts access (for Execute Command node)
      - ./scripts:/scripts:ro
      
    networks:
      - homebot-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: homebot-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - homebot-network

  ollama:
    image: ollama/ollama:latest
    container_name: homebot-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - homebot-network

volumes:
  n8n_data:
    driver: local
  qdrant_data:
    driver: local

  ollama_data:
    driver: local

networks:
  homebot-network:
    driver: bridge
