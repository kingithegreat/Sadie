version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: homebot-n8n
    restart: unless-stopped
    ports:
      # Bind to loopback only — these are local single-user services and must
      # not be reachable from other hosts on the LAN.
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      # No hardcoded fallback: a shared key would let anyone with this repo
      # decrypt every install's stored credentials. When unset, n8n generates
      # and persists its own random key in the n8n_data volume.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - GENERIC_TIMEZONE=Pacific/Auckland
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console
      - N8N_WORKFLOW_HISTORY_ENABLED=true
      # The Auth Guard Code nodes in every n8n-workflows/*.json read the shared
      # secret from process.env. n8n blocks container env access from Code nodes
      # unless this is explicitly false — with it blocked, every guard silently
      # skips validation (verified 2026-08-22: envLen=0 inside the node while the
      # container had the 64-char secret).
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Shared secret used by HomeBot to authenticate webhook requests.
      # start-homebot.ps1 sets this from the auto-generated webhook-secret file.
      - HOMEBOT_WEBHOOK_SECRET=${HOMEBOT_WEBHOOK_SECRET:-}
      
    volumes:
      # Persistent data
      - n8n_data:/home/node/.n8n
      
      # Memory volume for Docker
      - ./memory:/data/memory
      
      # Config volume for safety rules
      - ./config:/data/config:ro
      
      # Workflow imports (optional)
      - ./n8n-workflows:/workflows:ro
      
      # Custom scripts access (for Execute Command node)
      - ./scripts:/scripts:ro
      
    networks:
      - homebot-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: homebot-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - homebot-network

  ollama:
    image: ollama/ollama:latest
    container_name: homebot-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - homebot-network

volumes:
  n8n_data:
    driver: local
  qdrant_data:
    driver: local

  ollama_data:
    driver: local

networks:
  homebot-network:
    driver: bridge
