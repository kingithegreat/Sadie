# LEGACY, NOT USED. `npm run dist` and CI run electron-builder from widget/
# without --config, so the real packaging config is the "build" field in
# widget/package.json. This file is kept only until Aden decides to delete it.
appId: com.homebot.app
productName: HomeBot
directories:
  output: dist-electron
  buildResources: build
files:
  - out/**
  - scripts/**
  - "!scripts/tools/powershell/**"
extraResources:
  - from: "../docker-compose.yml"
    to: "docker-compose.yml"
  - from: "../config"
    to: "config"
  - from: "../n8n-workflows"
    to: "n8n-workflows"
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true