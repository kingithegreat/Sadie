name: Playwright E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Advisory, non-blocking. This runs the FULL Playwright suite in a single
    # process (workers:1, ~7 min) against docker services — that sequential load
    # induces non-deterministic timeouts (a different test flakes each run; all
    # pass on retry) plus occasional "errors were not a part of any test"
    # teardown noise, which red-flags the run even though the suite is healthy.
    # The authoritative gate is the sharded `widget-e2e` workflow (3 shards × 3
    # OS, isolated) which covers the same specs reliably. Keep this as a visible
    # signal without letting its flakiness block merges.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start docker services
        run: docker compose up -d || echo "Docker services failed to start (non-fatal for E2E mock mode)"

      - name: Wait for n8n to be ready
        run: |
          echo "Waiting for n8n (up to 60s)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5678/healthz >/dev/null 2>&1; then
              echo "n8n is ready after $((i*2))s"
              break
            fi
            sleep 2
          done
          echo "n8n wait complete (tests use HOMEBOT_E2E mock mode)"

      - name: Install widget dependencies
        run: npm ci --prefix widget

      - name: Fix Electron sandbox permissions
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root widget/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 widget/node_modules/electron/dist/chrome-sandbox

      - name: Install Playwright browsers
        run: npm run e2e:install --prefix widget

      - name: Build widget
        env:
          NODE_ENV: test
        run: npm run build --prefix widget

      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Playwright E2E (Linux)
        if: runner.os == 'Linux'
        env:
          HOMEBOT_E2E: '1'
          NODE_ENV: 'test'
        run: xvfb-run -s "-screen 0 1920x1080x24" npm run e2e --prefix widget

      - name: Run Playwright E2E (non-Linux)
        if: runner.os != 'Linux'
        env:
          HOMEBOT_E2E: '1'
          NODE_ENV: 'test'
        run: npm run e2e --prefix widget

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: widget/playwright-report

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: widget/test-results/junit.xml

      - name: Teardown docker services
        if: always()
        run: docker compose down --volumes
