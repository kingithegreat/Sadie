# Widget E2E Full Matrix Workflow
name: Widget E2E Tests

on:
  push:
    branches:
      - feature/renderer-ui-wiring
      - 'feat/**'
  pull_request:

jobs:
  sanity:
    name: Sanity (scheduling check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sanity echo
        run: |
          echo "SANITY: branch=$GITHUB_REF event=$GITHUB_EVENT_NAME sha=$GITHUB_SHA"
          node --version || true
          npx playwright --version || true

  e2e:
    runs-on: ${{ matrix.os }}
    # Without this, the job inherits GitHub's 6-hour default.
    #
    # Observed on PR #174: seven shards finished in 2m35s-9m27s while two Ubuntu
    # shards ran past 90 minutes. `gh pr checks` shows both states as "pending",
    # so a hung shard and a slow one are indistinguishable, and `e2e-all` — a
    # REQUIRED check — simply never reports. The merge waits, and no one can
    # tell whether it is waiting on work or on nothing.
    #
    # 35 minutes is ~3.5x the slowest healthy shard, which leaves room for a
    # cold cache and a genuinely failing test to retry, and still fails loudly
    # inside a coffee break instead of silently until lunch tomorrow.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22]
        shardIndex: [1, 2, 3]
        totalShards: [3]
    env:
      HOMEBOT_E2E: '1'
      NODE_ENV: test
      PLAYWRIGHT_JUNIT_OUTPUT: test-results/junit-${{ matrix.os }}-shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}.xml
      PLAYWRIGHT_TRACES_DIR: traces/${{ matrix.os }}/shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}
      PLAYWRIGHT_VIDEO_DIR: test-results/videos/${{ matrix.os }}/shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}
      PLAYWRIGHT_HTML_REPORT: playwright-report/${{ matrix.os }}/shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}
    steps:
      - uses: actions/checkout@v4
      - name: Runner info
        run: |
          echo "RUNNER: $RUNNER_OS"
          echo "GITHUB_REF: $GITHUB_REF"
          node --version || true
          npx playwright --version || true
          uname -a || true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache widget node_modules
        uses: actions/cache@v3
        with:
          path: widget/node_modules
          key: ${{ matrix.os }}-node-${{ hashFiles('widget/package-lock.json') }}
          restore-keys: |
            ${{ matrix.os }}-node-
      - name: Install widget dependencies
        timeout-minutes: 10
        run: npm ci --prefix widget
      - name: Cache Playwright binaries
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            C:\Users\runneradmin\AppData\Local\ms-playwright
          key: ${{ matrix.os }}-playwright-${{ hashFiles('widget/package-lock.json') }}
          restore-keys: |
            ${{ matrix.os }}-playwright-
      # This is where the two Ubuntu shards on PR #174 actually hung — for over
      # 90 minutes, before the run was cancelled. The job log ended with:
      #
      #   Terminate orphan process: pid (2478) (npm exec playwright install --with-deps)
      #
      # and uploaded no report, because not one test had run. `--with-deps`
      # shells out to apt-get on Linux only, which is why the same commit passed
      # on all six Windows and macOS shards.
      #
      # A hang here previously looked identical to a slow test suite. Ten minutes
      # is generous for a browser download and an apt install, and when it trips
      # the failure names this step instead of the tests.
      - name: Install Playwright browsers
        timeout-minutes: 10
        working-directory: widget
        run: npx playwright install --with-deps
      - name: Prepare Playwright artifact directories
        run: |
          node -e "const fs = require('fs'); const dirs = ['playwright-report/${{ matrix.os }}/shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}','test-results/${{ matrix.os }}/shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}','traces/${{ matrix.os }}/shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}','test-results/videos/${{ matrix.os }}/shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}']; dirs.forEach(d => { try { fs.mkdirSync('widget/' + d, { recursive: true }) } catch(e){} });"
      - name: Build widget
        run: npm run build --prefix widget
      # Two layers of retry, not three.
      #
      # Playwright's own --retries=2 already gives every test three goes, which
      # is what flake needs. The loop around it re-runs the WHOLE shard, and it
      # earns its place only for failures Playwright cannot retry past — the
      # runner or xvfb dying before any test reports. One spare attempt covers
      # that; the third only multiplied a real failure's runtime by 50%.
      #
      # It was 3 outer x 3 inner = up to NINE runs of every failing test, which
      # is how a ~9-minute shard became a 90-minute one and buried the actual
      # failure under eight identical repeats of itself.
      #
      # Each attempt now prints its exit code and elapsed seconds, so the log
      # says which attempt is running and how long it has been going.
      - name: Run E2E tests (sharded)
        run: |
          node -e "const { spawnSync } = require('child_process'); const linux = process.platform === 'linux'; const e2eArgs = ['run','e2e','--prefix','widget','--silent','--','--shard=${{ matrix.shardIndex }}/${{ matrix.totalShards }}','--retries=2','--trace=on-first-retry']; const cmd = linux ? 'xvfb-run' : 'npm'; const args = linux ? ['-a','npm',...e2eArgs] : e2eArgs; const ATTEMPTS = 2; const t0 = Date.now(); let rc = 1; for (let i = 0; i < ATTEMPTS; i++) { console.log('Playwright attempt ' + (i+1) + ' of ' + ATTEMPTS); const a0 = Date.now(); const r = spawnSync(cmd, args, { stdio: 'inherit' }); rc = r.status; console.log('attempt ' + (i+1) + ' exited ' + rc + ' after ' + Math.round((Date.now()-a0)/1000) + 's; elapsed ' + Math.round((Date.now()-t0)/1000) + 's'); if (rc === 0) break; } process.exit(rc);"
      - name: Upload Playwright Artifacts (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}-shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}-${{ github.run_id }}-${{ github.sha }}-failure
          path: |
            widget/playwright-report/${{ matrix.os }}/shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}/
            widget/test-results/${{ matrix.os }}/shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}/
            widget/traces/${{ matrix.os }}/shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}/
            widget/test-results/videos/${{ matrix.os }}/shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}/
      - name: Upload Playwright Artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}-shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}-${{ github.run_id }}-${{ github.sha }}
          path: |
            widget/playwright-report/${{ matrix.os }}/shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}/
            widget/test-results/${{ matrix.os }}/shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}/
            widget/traces/${{ matrix.os }}/shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}/
            widget/test-results/videos/${{ matrix.os }}/shard-${{ matrix.shardIndex }}-of-${{ matrix.totalShards }}/

  # One context for branch protection to require, instead of nine.
  #
  # This suite ran on every PR for months while failing 28 of 30 runs, and
  # nothing noticed — because no check derived from it could block a merge,
  # and a gate that cannot block is decoration. Requiring all nine
  # os×shard contexts individually would be brittle (renaming the matrix
  # silently un-requires them); this job collapses the matrix to a single
  # stable name.
  #
  # `if: always()` matters: without it, a cancelled or failed shard SKIPS this
  # job, and a skipped check does not block a merge — the gate would wave
  # through the exact failures it exists to stop.
  e2e-all:
    name: e2e-all
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every shard must have passed
        run: |
          echo "matrix result: ${{ needs.e2e.result }}"
          test "${{ needs.e2e.result }}" = "success"
