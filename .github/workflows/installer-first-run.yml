name: Installer first-run (Windows)
on:
  workflow_dispatch:
  pull_request:
    paths: ['widget/**', '.github/workflows/installer-first-run.yml']
permissions:
  contents: read
jobs:
  installer-first-run:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix widget
      - name: Build installer (no publish)
        run: npm run dist --prefix widget -- --publish never
      - name: Retain the exact private installer and its source identity
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem -LiteralPath widget/dist-electron -Filter '*.exe' -File | Where-Object Name -notmatch 'uninstaller')
          if ($setups.Count -ne 1) { throw "Expected one installer, found $($setups.Count)" }
          New-Item -ItemType Directory -Path private-installer -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath $setups[0].FullName -Destination private-installer -ErrorAction Stop
          $sourceCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify the checked-out source' }
          $lock = Get-Content -LiteralPath widget/package-lock.json -Raw | ConvertFrom-Json
          $receipt = [ordered]@{
            sourceCommit = $sourceCommit
            workflowHead = '${{ github.sha }}'
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            installer = [ordered]@{
              name = $setups[0].Name
              bytes = $setups[0].Length
              sha256 = (Get-FileHash -LiteralPath $setups[0].FullName -Algorithm SHA256).Hash
            }
            widgetLockSha256 = (Get-FileHash -LiteralPath widget/package-lock.json -Algorithm SHA256).Hash
            electron = $lock.packages.'node_modules/electron'.version
            nodePty = $lock.packages.'node_modules/node-pty'.version
            speech = $lock.packages.'node_modules/msedge-tts'.version
            scope = 'Unsigned private candidate; install/window/uninstall smoke only. Full workflows and owner acceptance remain separate.'
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath private-installer/receipt.json -Encoding utf8
      - name: Silent install, launch once, check, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem widget/dist-electron/*.exe | Where-Object Name -notmatch 'uninstaller' | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          # Find the install folder from the per-user uninstall entry, not a guessed path.
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            Get-ItemProperty | Where-Object { $_.DisplayName -like 'HomeBot*' } | Select-Object -First 1
          if (-not $entry) { throw 'No HomeBot uninstall entry after silent install' }
          $dir = if ($entry.InstallLocation) { $entry.InstallLocation.Trim('"') } else { Split-Path ($entry.UninstallString -replace '^"([^"]+)".*$','$1') }
          "Installed to $dir"
          if (-not (Test-Path "$dir\HomeBot.exe")) { Get-ChildItem $dir | Format-Table Name; throw "HomeBot.exe not found in $dir" }
          $uninstaller = ($entry.UninstallString -replace '^"([^"]+)".*$','$1')
          Get-Process HomeBot -ErrorAction SilentlyContinue | Stop-Process -Force
          $p = Start-Process "$dir\HomeBot.exe" -PassThru
          $deadline = (Get-Date).AddSeconds(90); $ready = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep 3
            if ($p.HasExited) { throw "HomeBot exited early with code $($p.ExitCode)" }
            $w = Get-Process HomeBot -ErrorAction SilentlyContinue | Where-Object MainWindowHandle -ne 0
            if ($w) { $ready = $true; break }
          }
          if (-not $ready) { throw 'No HomeBot window within 90s' }
          Start-Sleep 10
          if ($p.HasExited) { throw "HomeBot crashed after showing its window (code $($p.ExitCode))" }
          Get-Process HomeBot -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          Start-Process $uninstaller -ArgumentList '/S' -Wait
          Start-Sleep 5
          if (Test-Path "$dir\HomeBot.exe") { throw 'Uninstall left HomeBot.exe behind' }
          'First-run check passed.'
      - name: Verify the retained installer is unchanged after the smoke test
        shell: pwsh
        run: |
          $receipt = Get-Content -LiteralPath private-installer/receipt.json -Raw | ConvertFrom-Json
          $file = Get-Item -LiteralPath (Join-Path private-installer $receipt.installer.name)
          if ($file.Length -ne $receipt.installer.bytes -or (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash -ne $receipt.installer.sha256) {
            throw 'Retained installer changed after packaging'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: private-windows-installer-${{ github.sha }}-${{ github.run_id }}
          path: private-installer/
          if-no-files-found: error
          retention-days: 14
