name: Permissions Smoke

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'claude/**'
  pull_request:
  workflow_dispatch: {}

jobs:
  smoke:
    name: Permissions smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        # npm ci has no built-in retry; registry timeouts have failed this
        # REQUIRED check twice on their own. Three attempts, 15s apart.
        run: |
          cd widget
          for i in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $i failed — retrying in 15s"
            sleep 15
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Run smoke test
        run: |
          cd widget
          npm run test:smoke
